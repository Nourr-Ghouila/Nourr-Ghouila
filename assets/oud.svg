<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g transform="rotate(35 32 34) translate(0 3)">
    <!-- pegbox, bent back -->
    <path d="M28.6 7 L35.4 7 L44 -2.5 L40.2 -5 Z" fill="#6b4219"/>
    <g stroke="#e0a955" stroke-width="1.5" stroke-linecap="round">
      <line x1="32.2" y1="3.6" x2="29.2" y2="2.2"/>
      <line x1="34.6" y1="0.9" x2="31.6" y2="-0.5"/>
      <line x1="37" y1="-1.8" x2="34" y2="-3.2"/>
      <line x1="35.4" y1="5.4" x2="38.6" y2="6.6"/>
      <line x1="37.8" y1="2.7" x2="41" y2="3.9"/>
      <line x1="40.2" y1="0" x2="43.4" y2="1.2"/>
    </g>
    <!-- neck -->
    <path d="M28.6 6 L35.4 6 L36.4 21 L27.6 21 Z" fill="#6b4219"/>
    <!-- pear-shaped body tapering into the neck -->
    <path d="M27.6 19 C21 25.5 14.5 35 14.5 46 C14.5 55.5 22 62 32 62 C42 62 49.5 55.5 49.5 46 C49.5 35 43 25.5 36.4 19 Z" fill="#c8913a" stroke="#6b4219" stroke-width="2" stroke-linejoin="round"/>
    <!-- rosette -->
    <circle cx="32" cy="35" r="4.6" fill="#3b2410"/>
    <circle cx="32" cy="35" r="6" fill="none" stroke="#6b4219" stroke-width="1"/>
    <!-- pickguard -->
    <path d="M27.5 43 C29 42 35 42 36.5 43 L35.5 51 C34 52 30 52 28.5 51 Z" fill="#3b2410"/>
    <!-- bridge -->
    <rect x="26.5" y="55" width="11" height="2.4" rx="1.2" fill="#6b4219"/>
    <!-- strings -->
    <g stroke="#f3e3c3" stroke-width="0.55">
      <line x1="30.6" y1="6.5" x2="29.6" y2="55.5"/>
      <line x1="31.5" y1="6.5" x2="31.1" y2="55.5"/>
      <line x1="32.5" y1="6.5" x2="32.9" y2="55.5"/>
      <line x1="33.4" y1="6.5" x2="34.4" y2="55.5"/>
    </g>
  </g>
</svg>
